name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0"
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore ShopMGR.sln

      - name: Build
        run: dotnet build ShopMGR.sln --no-restore

      - name: Ejecutar tests de backend (incluye cobertura)
        run: dotnet test ShopMGR.sln --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Verificar Test Coverage
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find TestResults -name "coverage.cobertura.xml" | head -1)
          python3 - "$FILE" <<'PY'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse(sys.argv[1]); root = tree.getroot()
          excl = {'ShopMGR.Contexto', 'Middleware'}
          covered = valid = 0
          for pkg in root.iter('package'):
              name = pkg.get('name', '')
              if any(name.startswith(e) for e in excl):
                  continue
              for cls in pkg.iter('class'):
                  lines = cls.find('lines')
                  if lines is None: continue
                  for l in lines.iter('line'):
                      valid += 1
                      if int(l.get('hits', 0)) > 0: covered += 1
          rate = covered / valid if valid else 0
          print(f"Cobertura gate backend: {covered}/{valid} = {rate:.2%}")
          if rate < 0.60:
              print("::error::Umbral de cobertura backend no alcanzado (mínimo 60%)")
              sys.exit(1)
          PY


  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        run: npm install
        working-directory: Frontend

      - name: Ejecutar tests de frontend
        run: npm run test:coverage
        working-directory: Frontend
