name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        run: npm install
        working-directory: Frontend

      - name: Instalar browsers de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: Frontend

      - name: Generar environment.env (efímero para CI)
        run: |
          cat > environment.env <<EOF
          MSSQL_SA_PASSWORD=E2e!Passw0rd2026
          Jwt__Token=CI_JWT_$(openssl rand -hex 32)
          ConnectionStrings__ShopMGRDbContexto=Server=db;database=ShopMGR;UID=sa;PWD=E2e!Passw0rd2026;TrustServerCertificate=True;Encrypt=False
          ASPNETCORE_ENVIRONMENT=Development
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          EOF

      - name: Levantar base de datos
        run: docker compose up -d db

      - name: Esperar SQL Server listo
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T db /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'E2e!Passw0rd2026' -C -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "SQL Server listo"
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server no respondió a tiempo" >&2
          exit 1

      - name: Construir y levantar la app
        run: docker compose up -d --build app

      - name: Ejecutar seeder (datos base)
        run: docker compose run --rm --profile tools seeder

      - name: Esperar frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "Frontend listo"
              exit 0
            fi
            sleep 5
          done
          echo "Frontend no respondió a tiempo" >&2
          exit 1

      - name: Esperar login funcional (API)
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          for i in $(seq 1 3); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST http://localhost:3000/api/Auth/IniciarSesion \
              -H 'Content-Type: application/json' \
              -d "{\"userName\":\"$ADMIN_USERNAME\",\"password\":\"$ADMIN_PASSWORD\"}")
            if [ "$code" = "200" ]; then
              echo "Login funcional (HTTP 200)"
              exit 0
            fi
            echo "Login aún no disponible (HTTP $code), reintento en 20s"
            sleep 20
          done
          echo "La API nunca validó el login" >&2
          exit 1

      - name: Ejecutar E2E (Playwright)
        env:
          CI: "1"
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npx playwright test --config e2e/playwright.config.ts
        working-directory: Frontend

      - name: Subir reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Frontend/playwright-report/
          retention-days: 14

      - name: Subir trazas y resultados (fallo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: Frontend/test-results/
          retention-days: 14
